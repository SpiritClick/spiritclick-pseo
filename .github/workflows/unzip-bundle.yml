name: Unzip bundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bundle and commit site files
        run: |
          unzip -o pseo-bundle-20261019.zip -d bundle-tmp
          echo "Top-level bundle contents:"
          ls bundle-tmp
          shopt -s dotglob
          mv bundle-tmp/cloudflare-bundle/* .
          rm -rf bundle-tmp pseo-bundle-20261019.zip
          rm .github/workflows/unzip-bundle.yml
          git config user.name "SpiritClick"
          git config user.email "spiritclickteam@gmail.com"
          git add -A
          git commit -m "Deploy SpiritClick PSEO site files"
          git push
